# =============================================================================
# Flapjack Cloud Local Dev Stack
# =============================================================================
# Usage:
#   cp .env.local.example .env.local   # fill in values
#   bash scripts/local-dev-up.sh       # start Docker dependencies + Flapjack
#   bash scripts/api-dev.sh            # start the API on the host
#   bash scripts/web-dev.sh            # start the web app on the host
#   docker compose down                # stop all services
#   docker compose down -v             # stop and remove data volumes
#
# See docs/runbooks/local-dev.md for full instructions.
# local-dev-up.sh exports worktree-derived host ports before invoking Compose.
# The fallbacks below preserve direct `docker compose` compatibility.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fjcloud_dev
      POSTGRES_USER: griddle
      POSTGRES_PASSWORD: griddle_local
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griddle -d fjcloud_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

  # --- Local S3 (SeaweedFS) ---
  # Lightweight S3-compatible object store for local cold storage.
  # Replaces InMemoryObjectStore with persistent storage that survives restarts.
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/seaweedfs/s3_config.json
    ports:
      - "${LOCAL_S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
      - ./ops/seaweedfs_s3_config.json:/etc/seaweedfs/s3_config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true); test \"$$code\" = 200 -o \"$$code\" = 403"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Local Email (Mailpit) ---
  # Catches all outgoing email from MailpitEmailService.
  # Web UI + API: http://localhost:8025
  # SMTP: localhost:1025 (unused — we use the HTTP JSON API directly).
  mailpit:
    image: axllent/mailpit
    ports:
      - "${LOCAL_SMTP_PORT:-1025}:1025"
      - "${LOCAL_MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    profiles: ["source-providers"]
    image: getmeili/meilisearch@sha256:9694a59df43ee3f54b3fda9c5de381a3ee9852678e3e31cadf37d6bddea7fc1b
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-local-source-provider-key}"
    ports:
      - "127.0.0.1:${LOCAL_MEILISEARCH_PORT:-7710}:7700"
    tmpfs:
      - /meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  typesense:
    profiles: ["source-providers"]
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    environment:
      TYPESENSE_API_KEY: "${TYPESENSE_API_KEY:-local-source-provider-key}"
      TYPESENSE_DATA_DIR: /data
    ports:
      - "127.0.0.1:${LOCAL_TYPESENSE_PORT:-8108}:8108"
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8108; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  s3data:
